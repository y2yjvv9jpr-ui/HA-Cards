type: sections
max_columns: 3
title: Haus
path: haus
theme: kibibit
sections:
  - type: grid
    column_span: 3
    cards:
      - type: custom:des-cover-card
        grid_options:
          columns: 12
          rows: 4
        name: Rollläden
        group_entity: cover.rollladen
        scenes:
          - name: Tag
            icon: mdi:weather-sunny
            action:
              service: script.turn_on
              target:
                entity_id: script.guten_morgen
          - name: Nacht
            icon: mdi:weather-night
            action:
              service: script.turn_on
              target:
                entity_id: script.gute_nacht
          - name: Vormittag
            icon: mdi:weather-sunset-up
            action:
              service: input_boolean.turn_on
              target:
                entity_id: input_boolean.helperrssunvormittag
          - name: Nachmittag
            icon: mdi:weather-sunset-down
            action:
              service: input_boolean.turn_on
              target:
                entity_id: input_boolean.helperrssunnachmittag
          - name: Aquarien
            icon: mdi:fish
            action:
              service: automation.trigger
              target:
                entity_id: automation.aquarium_arbeitszimmer_sonnenschutz
              data:
                skip_condition: true
        sections:
          - name: Erdgeschoss
            covers:
              - entity: cover.jalousie_eg_flur_jalousie_eg_flur
                name: Flur
              - entity: cover.jalousie_eg_arbeitszimmer_vorn_2
                name: Arbeitszimmer vorne
              - entity: cover.jalousie_eg_arbeitszimmer_seite
                name: Arbeitszimmer Seite
              - entity: cover.jalousie_eg_couch_klein
                name: Couch klein
              - entity: cover.jalousie_eg_couch_gross_2
                name: Couch groß
              - entity: cover.shelly2pmg4_48f6eed04f08_jalousie_eg_esszimmer
                name: Esszimmer
              - entity: cover.shellyswitch25_e8db84aa7195
                name: Küche
              - entity: cover.jalousie_eg_technikraum_jalousie_eg_technikraum
                name: Technikraum
              - entity: cover.jalousie_eg_wc_jalousie_eg_wc
                name: Gäste-WC
          - name: Obergeschoss
            covers:
              - entity: cover.jalousie_og_bad
                name: Bad
              - entity: cover.jalousie_og_ankleide
                name: Ankleide
              - entity: cover.jalousie_og_schlafzimmer_2
                name: Schlafzimmer
              - entity: cover.jalousie_og_marie_jalousie_og_marie
                name: Kinderzimmer Marie
              - entity: cover.jalousie_og_aneka_jalousie_og_aneka
                name: Anekas Zimmer
        modes:
          - entity: input_boolean.helperluftungsmodus
            name: Lüftung
            color: blue
          - entity: input_boolean.urlaub
            name: Urlaub
            color: amber
      - type: custom:des-light-card
        grid_options:
          columns: 12
          rows: 3
        name: Wohnzimmer
        items:
          - entity: light.spots_wohnzimmer
            name: Spots
            icon: mdi:track-light
            kind: dim
          - entity: switch.licht_esstisch
            name: Essen
            icon: mdi:vanity-light
            kind: switch
            on_action:
              service: script.turn_on
              target:
                entity_id: script.esstisch_ambiente
            on_label: Ambiente
          - entity: switch.licht_couchtisch
            name: Couch
            icon: mdi:ceiling-light
            kind: switch
      - type: custom:weather-forecast-card
        show_current: true
        show_forecast: true
        default_forecast: daily
        forecast_types: both
        tap_action:
          action: more-info
        entity: weather.braunschwg
        show_condition_effects:
          - moon
          - sun
          - cloud
          - rain
          - snow
          - lightning
        show_moon_phase: true
        forecast:
          mode: chart
          show_sun_times: true
          use_color_thresholds: true
          scroll_to_selected: true
          default_chart_attribute: temperature_and_precipitation
          extra_attribute: wind_bearing
          hourly_group_size: 1
        forecast_action:
          tap_action:
            action: toggle-forecast
          hold_action:
            action: select-forecast-attribute
        current:
          secondary_info_attribute: humidity
      - type: custom:des-dehumidifier-card
        grid_options:
          columns: 12
          rows: 5
        name: Luftentfeuchter
        location: Arbeitszimmer
        humidity_entity: sensor.arete_r_two_25l_dehumidifier_air_purifier_luftfeuchtigkeit
        humidifier_entity: humidifier.arete_r_two_25l_dehumidifier_air_purifier
        power_entity: fan.arete_r_two_25l_dehumidifier_air_purifier
        countdown_entity: select.arete_r_two_25l_dehumidifier_air_purifier_countdown
        countdown_off_option: Abbrechen
        child_lock_entity: switch.arete_r_two_25l_dehumidifier_air_purifier_kindersicherung
        history_hours: 24
        target_min: 30
        target_max: 80
        target_step: 5
        faults:
          - entity: binary_sensor.arete_r_two_25l_dehumidifier_air_purifier_tank_voll
            name: Tank voll
            severity: error
          - entity: binary_sensor.arete_r_two_25l_dehumidifier_air_purifier_nass
            name: Nass
            severity: error
          - entity: >-
              binary_sensor.arete_r_two_25l_dehumidifier_air_purifier_temperaturfehler
            name: Temperaturfehler
            severity: error
          - entity: binary_sensor.arete_r_two_25l_dehumidifier_air_purifier_abtauen
            name: Abtauen
            severity: warning
      - type: custom:des-bed-light-card
        grid_options:
          columns: 12
          rows: 3
        name: Bett
      - type: custom:des-garage-card
        grid_options:
          columns: 12
          rows: 4
        name: Garage
        on_threshold_w: 2
        light:
          entity: light.garage_licht
          power_entity: sensor.garage_licht_power
          energy_entity: sensor.garage_licht_energy
          name: Licht
        devices:
          - entity: switch.garage_steckdose_werkbank
            power_entity: sensor.garage_steckdose_werkbank_power
            energy_entity: sensor.garage_steckdose_werkbank_energy
            name: Werkbank
          - entity: switch.garage_fraese
            power_entity: sensor.garage_fraese_power
            energy_entity: sensor.garage_fraese_energy
            name: Fräse
          - entity: switch.garage_steckdose_kappex
            power_entity: sensor.garage_steckdose_kappex_power
            energy_entity: sensor.garage_steckdose_kappex_energy
            name: Kappex
          - entity: switch.garage_kompressor
            power_entity: sensor.garage_kompressor_power
            energy_entity: sensor.garage_kompressor_energy
            name: Kompressor
          - entity: switch.garage_steckdose_staubsauger
            power_entity: sensor.garage_steckdose_staubsauger_power
            energy_entity: sensor.garage_steckdose_staubsauger_energy
            name: Staubsauger
          - entity: switch.garage_steckdose_tuer
            power_entity: sensor.garage_steckdose_tuer_power
            energy_entity: sensor.garage_steckdose_tuer_energy
            name: Tür
        settings:
          - entity: input_boolean.helper_moweron
            name: Mähroboter Laden aktiv
            pill: Mäher lädt
            color: blue
cards: []
