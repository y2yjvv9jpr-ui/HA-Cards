# pv_helper_energiezaehler.yaml
# Zweck:  Tages-/Wochen-/Monats-/Jahreszähler (Utility Meter).
#         Laden/Entladen/Verbrauch umfassen ALLE Speicher: Deye-Gesamtzähler
#         + Zendure (aus Leistung integriert, kWh, monoton).
#         Verbrauch (seit 10.09.2026): Integral der Hausleistung
#         sensor.pv_helper_haus_leistung (AC-Ausgang + Netz + Zendure-Abgabe
#         − Zendure-Aufnahme). Der Deye-Verbrauchszähler zählt Netzladen der
#         Hausakkus als Hausverbrauch mit (10.09.: 17,4 statt 12,2 kWh) und
#         wird nicht mehr verwendet.
#         Produktion/Import/Export = Deye-Gesamtzähler, ebenfalls über eine
#         geschützte _gesamt-Summe geführt (06.09.2026).
# Sprungschutz (06.09.2026): Die Deye-Gesamtzähler liefern bei Stick-Aussetzern
#         gelegentlich falsche Werte; ein Utility-Meter deutet einen Rückwärts-
#         sprung als Zählerreset und addiert danach den ganzen Zählerstand
#         (06.09.: Entladen-Tag 15,3 kWh statt 6,3; Export-Statistik −8.000 kWh
#         um 09:00). Deshalb übernehmen ALLE _gesamt-Summen einen neuen Wert
#         nur, wenn er höchstens 5 kWh vom letzten abweicht; sonst bleibt der
#         letzte Wert stehen. Chart und Utility-Meter lesen nur die _gesamt-Summen.
# Nutzer: des-stats-card, des-house-card, des-chart-card (Dashboard "Solar").
# Reset:  Tag 00:00, Woche Mo 00:00, Monat 1., Jahr 1.1. – HA-Zeit.
# Kalibrierung: utility_meter.calibrate bzw. script.pv_helper_energiezaehler_kalibrieren
# Stand:  2026-09-10

# ---------- Energie aus Leistung integrieren ----------
sensor:
  - platform: integration
    name: PV Helper Energie Verbrauch Integral
    unique_id: pv_helper_energie_verbrauch_integral
    source: sensor.pv_helper_haus_leistung
    method: left
    unit_prefix: k
    unit_time: h
    round: 3
  - platform: integration
    name: PV Helper Energie Zendure Laden Gesamt
    unique_id: pv_helper_energie_zendure_laden_gesamt
    source: sensor.zendure_power_from_home
    method: left
    unit_prefix: k
    unit_time: h
    round: 3
  - platform: integration
    name: PV Helper Energie Zendure Entladen Gesamt
    unique_id: pv_helper_energie_zendure_entladen_gesamt
    source: sensor.zendure_power_to_home
    method: left
    unit_prefix: k
    unit_time: h
    round: 3

# ---------- Geschützte Summen (Quelle für Utility-Meter und Chart) ----------
template:
  - sensor:
      - name: PV Helper Energie Laden Gesamt
        unique_id: pv_helper_energie_laden_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set neu = states('sensor.inverter_total_battery_charge') | float(0)
                       + states('sensor.pv_helper_energie_zendure_laden_gesamt') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.inverter_total_battery_charge') }}

      - name: PV Helper Energie Entladen Gesamt
        unique_id: pv_helper_energie_entladen_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set neu = states('sensor.inverter_total_battery_discharge') | float(0)
                       + states('sensor.pv_helper_energie_zendure_entladen_gesamt') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.inverter_total_battery_discharge') }}

      - name: PV Helper Energie Verbrauch Gesamt
        unique_id: pv_helper_energie_verbrauch_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        # Integral der Hausleistung (AC-seitig, inkl. Zendure), mit Sprungschutz.
        state: >-
          {% set neu = states('sensor.pv_helper_energie_verbrauch_integral') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.pv_helper_energie_verbrauch_integral') }}

      - name: PV Helper Energie Produktion Gesamt
        unique_id: pv_helper_energie_produktion_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set neu = states('sensor.inverter_total_production') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.inverter_total_production') }}

      - name: PV Helper Energie Import Gesamt
        unique_id: pv_helper_energie_import_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set neu = states('sensor.inverter_total_energy_import') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.inverter_total_energy_import') }}

      - name: PV Helper Energie Export Gesamt
        unique_id: pv_helper_energie_export_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: >-
          {% set neu = states('sensor.inverter_total_energy_export') | float(0) %}
          {% set alt = this.state | float(none) %}
          {% if alt is none or (neu - alt) | abs <= 5 %}{{ neu | round(2) }}{% else %}{{ alt }}{% endif %}
        availability: >-
          {{ has_value('sensor.inverter_total_energy_export') }}

utility_meter:
  # ---------- Tag (Laden/Entladen/Verbrauch; Produktion/Import/Export liefert der Deye) ----------
  pv_helper_energie_laden_tag:
    source: sensor.pv_helper_energie_laden_gesamt
    cycle: daily
    name: PV Helper Energie Laden Tag
  pv_helper_energie_entladen_tag:
    source: sensor.pv_helper_energie_entladen_gesamt
    cycle: daily
    name: PV Helper Energie Entladen Tag
  pv_helper_energie_verbrauch_tag:
    source: sensor.pv_helper_energie_verbrauch_gesamt
    cycle: daily
    name: PV Helper Energie Verbrauch Tag
  # ---------- Woche ----------
  pv_helper_energie_produktion_woche:
    source: sensor.pv_helper_energie_produktion_gesamt
    cycle: weekly
    name: PV Helper Energie Produktion Woche
  pv_helper_energie_verbrauch_woche:
    source: sensor.pv_helper_energie_verbrauch_gesamt
    cycle: weekly
    name: PV Helper Energie Verbrauch Woche
  pv_helper_energie_import_woche:
    source: sensor.pv_helper_energie_import_gesamt
    cycle: weekly
    name: PV Helper Energie Import Woche
  pv_helper_energie_export_woche:
    source: sensor.pv_helper_energie_export_gesamt
    cycle: weekly
    name: PV Helper Energie Export Woche
  pv_helper_energie_laden_woche:
    source: sensor.pv_helper_energie_laden_gesamt
    cycle: weekly
    name: PV Helper Energie Laden Woche
  pv_helper_energie_entladen_woche:
    source: sensor.pv_helper_energie_entladen_gesamt
    cycle: weekly
    name: PV Helper Energie Entladen Woche
  # ---------- Monat ----------
  pv_helper_energie_produktion_monat:
    source: sensor.pv_helper_energie_produktion_gesamt
    cycle: monthly
    name: PV Helper Energie Produktion Monat
  pv_helper_energie_verbrauch_monat:
    source: sensor.pv_helper_energie_verbrauch_gesamt
    cycle: monthly
    name: PV Helper Energie Verbrauch Monat
  pv_helper_energie_import_monat:
    source: sensor.pv_helper_energie_import_gesamt
    cycle: monthly
    name: PV Helper Energie Import Monat
  pv_helper_energie_export_monat:
    source: sensor.pv_helper_energie_export_gesamt
    cycle: monthly
    name: PV Helper Energie Export Monat
  pv_helper_energie_laden_monat:
    source: sensor.pv_helper_energie_laden_gesamt
    cycle: monthly
    name: PV Helper Energie Laden Monat
  pv_helper_energie_entladen_monat:
    source: sensor.pv_helper_energie_entladen_gesamt
    cycle: monthly
    name: PV Helper Energie Entladen Monat
  # ---------- Jahr ----------
  pv_helper_energie_produktion_jahr:
    source: sensor.pv_helper_energie_produktion_gesamt
    cycle: yearly
    name: PV Helper Energie Produktion Jahr
  pv_helper_energie_verbrauch_jahr:
    source: sensor.pv_helper_energie_verbrauch_gesamt
    cycle: yearly
    name: PV Helper Energie Verbrauch Jahr
  pv_helper_energie_import_jahr:
    source: sensor.pv_helper_energie_import_gesamt
    cycle: yearly
    name: PV Helper Energie Import Jahr
  pv_helper_energie_export_jahr:
    source: sensor.pv_helper_energie_export_gesamt
    cycle: yearly
    name: PV Helper Energie Export Jahr
  pv_helper_energie_laden_jahr:
    source: sensor.pv_helper_energie_laden_gesamt
    cycle: yearly
    name: PV Helper Energie Laden Jahr
  pv_helper_energie_entladen_jahr:
    source: sensor.pv_helper_energie_entladen_gesamt
    cycle: yearly
    name: PV Helper Energie Entladen Jahr
