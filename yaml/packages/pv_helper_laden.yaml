# ---------------------------------------------------------------------------
# pv_helper_laden.yaml
# Helfer und Automationen für Laden und Entladen des Zendure SolarFlow 2400 AC+.
# Konvention: <domain>.pv_helper_<gegenstand>_<größe>
#   Template-Sensoren und Automationen: Entity-ID entsteht aus dem Namen/Alias
#   → immer „PV Helper …". Umlaute werden zu u/a/o („Überschuss" → uberschuss).
#
# Ladelogik v4, 14.09.2026 (Vorgabe Daniel). Ersetzt die Ladeteilung v1–v3.1.
# Regelgrößen sind AUSSCHLIESSLICH PV-Leistung und Hausverbrauch — keine
#   Ladeleistung (Zendure oder Hausakkus), keine Einspeisung, kein Heizer. Der
#   Hausakku-SoC ist nur ein Umschalter, kein Regelwert.
# Warum: v1–v3 nutzten Ladeleistungen als Regelgröße; die hängen über den Deye
#   vom eigenen Sollwert ab (Bilanz Ü_L − L = Z + E + V) und trieben die Regel
#   gegen Min/Max. PV und Hausverbrauch sind davon unabhängig.
#
# Eingänge:
#   pv   = sensor.inverter_pv_power (PV-Leistung DC)
#   haus = sensor.pv_helper_haus_leistung (Hausverbrauch ohne Akkus/Zendure, A9)
#   soc  = sensor.inverter_battery (Hausakku-SoC gesamt)
#   maximum  = input_number.pv_helper_zendure_ladeleistung_maximum
#   vorzug   = input_number.pv_helper_ladeteilung_ziel  (1000)
#   start    = input_number.pv_helper_ladeteilung_start (1400, auf Ü_L)
#   stopp    = input_number.pv_helper_ladeteilung_stopp (800, auf Ü_L)
#   voll_soc = input_number.pv_helper_hausakku_voll_soc (90)
#
# Formeln:
#   Ü_L  = pv − haus                         → sensor.pv_helper_uberschuss_leistung
#          (Überschuss, der gespeichert werden kann)
#   voll = soc ≥ voll_soc                     (SoC unavailable → nicht voll)
#   Ü_Z  = voll ? Ü_L − 50 : (Ü_L − vorzug)/2 → sensor.pv_helper_zendure_ladeleistung_soll
#          Hausakkus haben 1000 W Vorzug, darüber halbe-halbe; ab voll_soc gehen
#          die Hausakkus als „voll" durch und alles fließt in den Zendure.
#          Sensor 0..maximum; hängt NICHT an der SoC-Verfügbarkeit.
#
# Überschussladen (nur Modus Auto, 30-s-Takt):
#   Start (aus Standby): nicht voll (Zendure) UND Ü_L > start → clamp(Ü_Z, 400,
#     maximum) schreiben, Quick Charge.
#   Regeln: clamp(Ü_Z, 400, maximum) nachführen, Totband 20 W.
#   Stopp: binary_sensor.pv_helper_zendure_ladestopp = Quick Charge UND
#     Ü_L < stopp (30 s) → Standby. Auch Zendure voll (A5) → Standby.
#
# Entladen (unverändert):
#   Sollwert = Abgabe − Einspeisung − Hausakku-LADUNG − 50 W. Hier zählt das
#   Laden der Hausakkus als „zu viel", sonst pumpt der Zendure in die Hausakkus.
#   Zendure entlädt nie in die Hausakkus: sobald der Zendure entlädt und die
#   Hausakkus laden (> 100 W), ist jede Hausakku-Ladung Zendure-Strom → der
#   Zendure geht sofort (ohne Verzögerung) in Standby.
#   Deye-Vorzeichen: external_power positiv = Netzbezug,
#   battery_power positiv = Entladen, negativ = Laden.
#
# Gerätegrenzen (zenSDK-Helfer): max_charge_power und max_discharge_power haben
#   Minimum 400 W. Laden startet daher erst ab Ü_L > start, geladen wird mit
#   clamp(Ü_Z, 400, maximum); Entladen erst ab (Entlademinimum + 50 W)
#   Hausakku-Entnahme. Feinere Leistungen nur über Modus Manual möglich (offen).
#
# Ein Schalter: input_select.pv_helper_zendure_lademodus (Karte Laden|Auto|Aus)
#   Laden → Quick Charge mit 2400 W bis zur Ladegrenze, egal was los ist.
#   Aus   → Standby, Automationen inaktiv (zum An-/Abstecken von Packs; 10.09.).
#   Auto  → Laden nach Ü_L/Ü_Z (oben), Entladen nach Bedarf (unten). Beide nur
#           aus Standby heraus, alles im 30-s-Takt, keine Kanten-Trigger. Alle
#           Stopp-Binärsensoren mit 30 s delay_on.
# Voll: binary_sensor.pv_helper_zendure_voll = SoC ≥ Ladegrenze ODER Quick
#   Charge nimmt 2 min lang < 100 W an. Gibt die Heizer frei.
# Prio Laden: Zendure vor Aquarienheizern beim Zuschalten (Bedingung
#   „zendure_frei" in „PV Solar Überschuss Aquarienheizung").
# Prio Entladen: Zendure vor Hausakku — Ziel Hausakku-Entnahme ≈ 50 W.
# Smart Matching (Gielz-Schleife) wird nicht mehr verwendet.
# Hinweis: Das SoC-Ziel hat gerätseitig eine Hysterese von ≥ 2 %.
# Notstromsteckdose: switch.pv_helper_zendure_notstromsteckdose schaltet die
#   Offgrid-Steckdose (gridOffMode 0 = Normal, 2 = Aus) über rest_command
#   zendure_setting des Gielz-Pakets; Zustand aus sensor.zendure_offgrid_mode.
# Stand: 2026-09-14
# ---------------------------------------------------------------------------

input_select:
  pv_helper_zendure_lademodus:
    name: PV Zendure Lademodus
    # Kein initial: der gewählte Modus bleibt über HA-Neustarts erhalten.
    options:
      - Laden
      - Auto
      - Aus
    icon: mdi:battery-charging-high

input_number:
  pv_helper_zendure_ladeleistung_maximum:
    name: PV Zendure Ladeleistung Maximum
    min: 400
    max: 2400
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:format-vertical-align-top
  pv_helper_zendure_entladeleistung_minimum:
    name: PV Zendure Entladeleistung Minimum
    min: 50
    max: 800
    step: 10
    unit_of_measurement: W
    mode: box
    icon: mdi:format-vertical-align-bottom
  pv_helper_zendure_entladeleistung_maximum:
    name: PV Zendure Entladeleistung Maximum
    # Gerätegrenze: der Zendure entlädt nicht unter 400 W, daher min 400.
    # Kein initial: der zuletzt auf der Karte gewählte Wert bleibt über Neustarts
    # erhalten (mit initial würde HA ihn bei jedem Start zurücksetzen).
    min: 400
    max: 2400
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:format-vertical-align-top
  # Ladelogik v4. Kein initial (Werte überleben Neustart); Auslieferungswerte
  # setzt Daniel einmal in HA.
  pv_helper_ladeteilung_start:
    name: PV Ladeteilung Start
    # Auslieferung: 1400 W. Ab diesem Überschuss Ü_L (pv − haus) startet der
    # Zendure.
    min: 500
    max: 3000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:call-split
  pv_helper_ladeteilung_ziel:
    name: PV Ladeteilung Ziel
    # Auslieferung: 1000 W. Vorzug der Hausakkus; erst über diesem Anteil teilt
    # sich der Überschuss halbe-halbe zwischen Hausakkus und Zendure.
    min: 400
    max: 3000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:target
  pv_helper_ladeteilung_stopp:
    name: PV Ladeteilung Stopp
    # Auslieferung: 800 W. Fällt der Überschuss Ü_L (pv − haus) darunter, geht
    # der Zendure aus (Hysterese Stopp/Start 800/1400 auf Ü_L).
    min: 100
    max: 2000
    step: 50
    unit_of_measurement: W
    mode: box
    icon: mdi:stop-circle-outline
  pv_helper_hausakku_voll_soc:
    name: PV Hausakku voll ab SoC
    # Auslieferung: 90 %. Ab diesem Hausakku-SoC gelten die Hausakkus als voll;
    # der Überschuss geht dann komplett in den Zendure. Kein initial.
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-90

template:
  - sensor:
      # Überschuss Ü_L = PV − Hausverbrauch (v4). Das ist, was gerade gespeichert
      # werden kann — unabhängig davon, wer es nimmt. Nur aus PV und Haus, keine
      # Ladeleistung, keine Einspeisung.
      - name: PV Helper Überschuss Leistung
        unique_id: pv_helper_uberschuss_leistung
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >-
          {% set pv = states('sensor.inverter_pv_power') | float(0) %}
          {% set haus = states('sensor.pv_helper_haus_leistung') | float(0) %}
          {{ (pv - haus) | round(0) }}
        availability: >-
          {{ has_value('sensor.inverter_pv_power')
             and has_value('sensor.pv_helper_haus_leistung') }}

      # Zendure-Ladesoll Ü_Z (v4): Hausakku-Vorzug, darüber halbe-halbe; ab
      # voll_soc gilt der Hausakku als voll und der Zendure nimmt alles (− 50 W
      # Reserve). SoC ist nur der Umschalter — der Sensor hängt bewusst NICHT an
      # der SoC-Verfügbarkeit (SoC fehlt → nicht voll → Teilung).
      - name: PV Helper Zendure Ladeleistung Soll
        unique_id: pv_helper_zendure_ladeleistung_soll
        unit_of_measurement: W
        state_class: measurement
        icon: mdi:target
        state: >-
          {% set ue_l = states('sensor.pv_helper_uberschuss_leistung') | float(0) %}
          {% set maximum = states('input_number.pv_helper_zendure_ladeleistung_maximum') | float(2400) %}
          {% set vorzug = states('input_number.pv_helper_ladeteilung_ziel') | float(1000) %}
          {% set soc = states('sensor.inverter_battery') | float(-1) %}
          {% set voll_soc = states('input_number.pv_helper_hausakku_voll_soc') | float(90) %}
          {% set voll = soc >= voll_soc %}
          {% set ue_z = (ue_l - 50) if voll else ((ue_l - vorzug) / 2) %}
          {{ [0, [ue_z, maximum] | min] | max | round(0) }}
        availability: >-
          {{ has_value('sensor.pv_helper_uberschuss_leistung')
             and has_value('input_number.pv_helper_zendure_ladeleistung_maximum') }}

      - name: PV Helper Zendure Entladeleistung Soll
        unique_id: pv_helper_zendure_entladeleistung_soll
        unit_of_measurement: W
        state_class: measurement
        icon: mdi:target
        state: >-
          {% set netz = states('sensor.inverter_external_power') | float(0) %}
          {% set akku = states('sensor.inverter_battery_power') | float(0) %}
          {% set ist = states('sensor.zendure_power_to_home') | float(0) %}
          {% set maximum = states('input_number.pv_helper_zendure_entladeleistung_maximum') | float(2400) %}
          {% set soll = ist + netz + akku - 50 %}
          {{ [0, [soll, maximum] | min] | max | round(0) }}
        availability: >-
          {{ has_value('sensor.inverter_external_power') and has_value('sensor.inverter_battery_power') and has_value('sensor.zendure_power_to_home') }}

  - binary_sensor:
      - name: PV Helper Hausakku Laedt
        unique_id: pv_helper_hausakku_laedt
        device_class: battery_charging
        icon: mdi:battery-arrow-up
        # Hausakkus nehmen mehr als 100 W auf (Deye: negativ = Laden).
        state: >-
          {{ states('sensor.inverter_battery_power') | float(0) < -100 }}
        availability: "{{ has_value('sensor.inverter_battery_power') }}"

      - name: PV Helper Zendure Voll
        unique_id: pv_helper_zendure_voll
        device_class: battery_charging
        icon: mdi:battery-check
        delay_on:
          minutes: 2
        state: >-
          {% set soc = states('sensor.zendure_total_state_of_charge') | float(0) %}
          {% set grenze = states('input_number.zendure_setting_maximum_allowed_state_of_charge') | float(100) %}
          {% set aufnahme = states('sensor.zendure_power_from_home') | float(0) %}
          {% set quick = is_state('input_select.zendure_operation_mode', 'Quick Charge') %}
          {{ soc >= grenze or (quick and aufnahme < 100) }}
        availability: >-
          {{ has_value('sensor.zendure_total_state_of_charge') and has_value('sensor.zendure_power_from_home') }}

      - name: PV Helper Zendure Ladestopp
        unique_id: pv_helper_zendure_ladestopp
        icon: mdi:stop-circle-outline
        delay_on:
          seconds: 30
        # Quick Charge UND Überschuss Ü_L < Stopp, 30 s → Laden beenden.
        state: >-
          {% set ue_l = states('sensor.pv_helper_uberschuss_leistung') | float(0) %}
          {% set stopp = states('input_number.pv_helper_ladeteilung_stopp') | float(800) %}
          {{ is_state('input_select.zendure_operation_mode', 'Quick Charge')
             and ue_l < stopp }}
        availability: >-
          {{ has_value('sensor.pv_helper_uberschuss_leistung')
             and has_value('input_number.pv_helper_ladeteilung_stopp') }}

      - name: PV Helper Zendure Entladestopp
        unique_id: pv_helper_zendure_entladestopp
        icon: mdi:stop-circle-outline
        delay_on:
          seconds: 30
        state: >-
          {% set minimum = states('input_number.pv_helper_zendure_entladeleistung_minimum') | float(400) %}
          {{ is_state('input_select.zendure_operation_mode', 'Quick Discharge')
             and states('sensor.pv_helper_zendure_entladeleistung_soll') | float(minimum) < minimum }}
        availability: "{{ has_value('sensor.pv_helper_zendure_entladeleistung_soll') }}"

  - switch:
      - name: PV Helper Zendure Notstromsteckdose
        unique_id: pv_helper_zendure_notstromsteckdose
        icon: mdi:power-socket-de
        # Offgrid-Steckdose des Zendure: gridOffMode 0 = Normal (an), 2 = Aus.
        # Schreibt über rest_command.zendure_setting des Gielz-Pakets.
        state: "{{ not is_state('sensor.zendure_offgrid_mode', 'Turned Off') }}"
        availability: "{{ has_value('sensor.zendure_offgrid_mode') and has_value('sensor.zendure_serial_number') }}"
        turn_on:
          - action: rest_command.zendure_setting
            data:
              sn: "{{ states('sensor.zendure_serial_number') }}"
              instellingitem: gridOffMode
              instellinginhoud: 0
        turn_off:
          - action: rest_command.zendure_setting
            data:
              sn: "{{ states('sensor.zendure_serial_number') }}"
              instellingitem: gridOffMode
              instellinginhoud: 2

automation:
  # -------------------------------------------------------------------------
  # Umschalten Laden|Auto|Aus sofort ausführen
  # -------------------------------------------------------------------------
  - id: pv_helper_zendure_lademodus
    alias: PV Helper Zendure Lademodus
    description: >-
      Setzt den Zendure beim Umschalten des Karten-Schalters sofort um:
      Laden → Quick Charge 2400 W; Auto → Standby (Automatik übernimmt);
      Aus → Standby, Automatik inaktiv.
    triggers:
      - trigger: state
        entity_id: input_select.pv_helper_zendure_lademodus
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.pv_helper_zendure_lademodus
                state: Laden
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_max_charge_power
                data:
                  value: 2400
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Quick Charge
          - conditions:
              - condition: state
                entity_id: input_select.pv_helper_zendure_lademodus
                state: Auto
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Standby
          - conditions:
              - condition: state
                entity_id: input_select.pv_helper_zendure_lademodus
                state: Aus
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Standby
    mode: restart

  # -------------------------------------------------------------------------
  # Überschussladen (nur im Modus Auto), alles im 30-s-Takt
  # -------------------------------------------------------------------------
  - id: pv_helper_zendure_ueberschussladen
    alias: PV Helper Zendure Überschussladen
    description: >-
      Lädt den Zendure nach Ü_Z (Hausakku-Vorzug, darüber halbe-halbe; ab
      voll_soc alles in den Zendure), Ziel = clamp(Ü_Z, 400, Maximum), Totband
      20 W. Start aus Standby, sobald der Zendure nicht voll ist und der
      Überschuss Ü_L = PV − Hausverbrauch über der Startschwelle liegt. Stopp
      über binary_sensor.pv_helper_zendure_ladestopp (Ü_L < Stopp) oder Zendure
      voll. Nur im Lademodus Auto.
    triggers:
      - trigger: time_pattern
        seconds: /30
      - trigger: state
        entity_id: binary_sensor.pv_helper_zendure_ladestopp
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.pv_helper_zendure_lademodus
        state: Auto
    variables:
      modus: "{{ states('input_select.zendure_operation_mode') }}"
      laedt: "{{ modus == 'Quick Charge' }}"
      soc: "{{ states('sensor.zendure_total_state_of_charge') | float(0) }}"
      soc_max: "{{ states('input_number.zendure_setting_maximum_allowed_state_of_charge') | float(100) }}"
      voll: "{{ soc >= soc_max }}"
      stopp: "{{ is_state('binary_sensor.pv_helper_zendure_ladestopp', 'on') }}"
      ueberschuss: "{{ states('sensor.pv_helper_uberschuss_leistung') | float(0) }}"
      start: "{{ states('input_number.pv_helper_ladeteilung_start') | float(1400) }}"
      soll: "{{ states('sensor.pv_helper_zendure_ladeleistung_soll') | float(0) }}"
      maximum: "{{ states('input_number.pv_helper_zendure_ladeleistung_maximum') | float(2400) }}"
      aktuell: "{{ states('input_number.zendure_setting_max_charge_power') | float(0) }}"
      ziel: "{{ [400, [soll, maximum] | min] | max | round(0) }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ laedt and (voll or stopp) }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Standby
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Standby' and not voll and ueberschuss > start }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_max_charge_power
                data:
                  value: "{{ ziel }}"
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Quick Charge
          - conditions:
              - condition: template
                value_template: "{{ laedt and (ziel - aktuell) | abs >= 20 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_max_charge_power
                data:
                  value: "{{ ziel }}"
    mode: single

  # -------------------------------------------------------------------------
  # Bedarfsentladen (nur im Modus Auto), alles im 30-s-Takt
  # -------------------------------------------------------------------------
  - id: pv_helper_zendure_bedarfsentladen
    alias: PV Helper Zendure Bedarfsentladen
    description: >-
      Entlädt den Zendure, sobald die Hausakkus mehr als (Minimum + 50 W)
      liefern, mit (Hausakku-Entnahme − 50 W), Minimum–2400 W, Totband 30 W.
      Sofort-Stopp (ohne Verzögerung), sobald der Zendure entlädt und die
      Hausakkus laden (> 100 W) — dann ist jede Hausakku-Ladung Zendure-Strom.
      Sonst Stopp über binary_sensor.pv_helper_zendure_entladestopp oder
      SoC ≤ min. SoC. Nur im Lademodus Auto.
    triggers:
      - trigger: time_pattern
        seconds: /30
      - trigger: state
        entity_id: binary_sensor.pv_helper_zendure_entladestopp
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.pv_helper_zendure_lademodus
        state: Auto
    variables:
      modus: "{{ states('input_select.zendure_operation_mode') }}"
      entlaedt: "{{ modus == 'Quick Discharge' }}"
      soc: "{{ states('sensor.zendure_total_state_of_charge') | float(0) }}"
      soc_min: "{{ states('input_number.zendure_setting_minimum_allowed_state_of_charge') | float(0) }}"
      leer: "{{ soc <= soc_min }}"
      startbereit: "{{ soc >= soc_min + 5 }}"
      stopp: "{{ is_state('binary_sensor.pv_helper_zendure_entladestopp', 'on') }}"
      hausakku: "{{ states('sensor.inverter_battery_power') | float(0) }}"
      hausakku_ladung: "{{ [0, - (states('sensor.inverter_battery_power') | float(0))] | max }}"
      soll: "{{ states('sensor.pv_helper_zendure_entladeleistung_soll') | float(0) }}"
      minimum: "{{ states('input_number.pv_helper_zendure_entladeleistung_minimum') | float(400) }}"
      maximum: "{{ states('input_number.pv_helper_zendure_entladeleistung_maximum') | float(2400) }}"
      aktuell: "{{ states('input_number.zendure_setting_max_discharge_power') | float(0) }}"
      ziel: "{{ [minimum, [soll, maximum] | min] | max | round(0) }}"
    actions:
      - choose:
          # Zendure entlädt nie in die Hausakkus: sobald er entlädt und die
          # Hausakkus laden, ist jede Hausakku-Ladung sein eigener Strom.
          # Sofort in Standby, ohne 30-s-Verzögerung.
          - conditions:
              - condition: template
                value_template: "{{ entlaedt and hausakku_ladung > 100 }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Standby
          - conditions:
              - condition: template
                value_template: "{{ entlaedt and (leer or stopp) }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Standby
          - conditions:
              - condition: template
                value_template: "{{ modus == 'Standby' and startbereit and hausakku > minimum + 50 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_max_discharge_power
                data:
                  value: "{{ ziel }}"
              - action: input_select.select_option
                target:
                  entity_id: input_select.zendure_operation_mode
                data:
                  option: Quick Discharge
          - conditions:
              - condition: template
                value_template: "{{ entlaedt and (ziel - aktuell) | abs >= 30 }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.zendure_setting_max_discharge_power
                data:
                  value: "{{ ziel }}"
    mode: single
